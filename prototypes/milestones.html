<!doctype html><meta charset=utf-8><title>Milestone upgrades</title>
<style>body{font:15px system-ui;background:#111;color:#eee;max-width:560px;margin:20px auto;padding:0 16px}button{width:100%;padding:10px;margin:4px 0;background:#2a3a55;color:#fff;border:0;border-radius:6px;text-align:left}button:disabled{opacity:.4}.bar{height:6px;background:#333;border-radius:3px}.bar i{display:block;height:100%;background:#6cf;border-radius:3px}</style>
<h3>Kabuto world: Zecter Energy <span id=g></span> (<span id=p></span>/s)</h3><div id=ui></div>
<script>
// cost = base*1.12^owned ; every milestone count doubles that tier; bar shows progress to next milestone (goal-gradient)
const T=[["Cast-Off Drones",10,1],["Hyper Clock Up Cells",80,7],["ClockUp Reactors",640,50],["Zecter Forge",5120,350]];
const MS=[10,25,50,100,200], G=1.12; let gold=10, own=T.map(_=>0);
const mult=n=>2**MS.filter(m=>n>=m).length, rate=i=>own[i]*T[i][2]*mult(own[i]);
const cost=i=>T[i][1]*G**own[i];
function fmt(x){return x<1e3?x.toFixed(x<10?1:0):x.toExponential(2)}
function render(){let h="";T.forEach((t,i)=>{if(i&&own[i-1]<5)return;const nxt=MS.find(m=>m>own[i])||"max",prev=[0,...MS].filter(m=>m<=own[i]).pop();
h+=`<button ${gold<cost(i)?"disabled":""} onclick="buy(${i})"><b>${t[0]}</b> x${own[i]} (x${mult(own[i])}) — ${fmt(cost(i))}<div class=bar><i style="width:${nxt=="max"?100:100*(own[i]-prev)/(nxt-prev)}%"></i></div><small>next x2 at ${nxt}</small></button>`});ui.innerHTML=h}
function buy(i){if(gold>=cost(i)){gold-=cost(i);own[i]++;render()}}
setInterval(()=>{const p=own.reduce((s,_,i)=>s+rate(i),0);gold+=p/10;g.textContent=fmt(gold);document.getElementById("p").textContent=fmt(p);render()},100);
</script>
