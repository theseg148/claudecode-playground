<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Decade Idle — vertical slice v2</title>
<style>
:root{--bg:#12151c;--card:#1c2230;--ink:#e8ecf4;--dim:#8a93a6;--acc:#e0457b;--ok:#5fd18a;--warn:#f0b64a}
body{margin:0;font:15px system-ui;background:var(--bg);color:var(--ink)}main{max-width:620px;margin:0 auto;padding:12px 16px 60px}
h1{font-size:18px;margin:8px 0}.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
button{font:inherit;color:var(--ink);background:#2b3550;border:0;border-radius:8px;padding:8px 12px;cursor:pointer}button:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.bar{height:6px;background:#2a3142;border-radius:3px;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
small{color:var(--dim)}.g{color:var(--ok)}.w{color:var(--warn)}#tel span{display:inline-block;width:8px;margin-right:1px;background:var(--ok)}
</style><main>
<h1 id=title></h1>
<div class=card><div class=row><div>Shots <b id=gold></b> <small>(+<span id=ps></span>/s)</small></div><div><small>Seals <b id=seals>0</b> ×<span id=sm>1</span> · Cards <b id=cards>0</b></small></div></div>
<div class=row style="margin-top:6px"><small>World goal: <span id=goalv></span></small><button id=photo>Photo Op!</button></div>
<div class=bar><i id=goalbar style="width:0"></i></div></div>
<div class=card id=clockcard><div class=row><div>Clock Up <small id=cinfo></small></div><button id=clock>Clock Up (4 Charge)</button></div></div>
<div id=gens></div>
<div class=card><b>Mastery</b> <small>points <span id=mp></span> — pick a build (each branch can reach the gate)</small><div id=tree></div></div>
<div class=card id=prev><small id=prevtxt></small></div>
<div class=card><div class=row><div>Final Form Ride <small id=ffrinfo></small></div><button id=ffr>Ride</button></div></div>
<div class=card><div class=row><div>Dimension Ride <small id=dinfo></small></div><button id=dim disabled>Ride →</button></div></div>
<div class=card><small>Speed: </small><button onclick="spd=1">×1</button> <button onclick="spd=10">×10</button> <button onclick="spd=100">×100</button> <button onclick="hardReset()">Reset save</button>
<div><small>Goal gaps (s, telemetry): <span id=tel></span></small></div><div><small id=stats></small></div></div>
<div id=toast class=card style="display:none"></div>
</main>
<script>
// Rules (DESIGN_RULES v2): R1 growth 1.12, R2 cost x8/rate x6, R3 x2 at 10/25/50/100/200, R5 reveal at 5 owned, R15 sqrt prestige +8%/pt (DEV values), R19 ride needs 4 tiers seen, R33 offline 50%/25% cap 8h, R34 active tools budget (Clock Up <=1.25x avg, Photo Op <=1.1x).
// DEV GATES: GOALMULT is tiny (3e6) so a bot can clear a world in minutes; the real plan uses ~1e18-1e20*3^w (sim/campaign3.py). Gate counts WORLD lifetime (S.wlife), not per-run.
const WORLDS=[{n:"Kabuto",t:["Cast-Off Cells","Zecter Charges","Clock-Up Cores","Hyper Zecters","ZECT Forges","Sōji's Kitchen"]},{n:"Den-O",t:["Rail Segments","Imagin Contracts","DenLiner Cars","Owner's Tickets","Time Tunnels","Terminal Stations"]}];
const G=1.12,MS=[10,25,50,100,200],TH=1e5,BONUS=.08,GOALMULT=[3e6,3e8];
let S=load()||{charge:5,clock:0,mp:0,tree:[],gold:15,own:[0,0,0,0,0,0],seals:0,life:0,w:0,cards:0,t0:Date.now(),last:Date.now(),goals:[],lastGoal:0,run:0,photoCD:0,maxTier:0};
let spd=1,sinceGoal=0;
S.wlife=S.wlife||S.life||0;S.charge=S.charge??5;S.clock=S.clock||0;S.mp=S.mp||0;S.tree=S.tree||[];
function load(){try{return JSON.parse(localStorage.getItem("decadeSliceV2"))}catch(e){return null}}
function save(){try{S.last=Date.now();localStorage.setItem("decadeSliceV2",JSON.stringify(S))}catch(e){}}
function hardReset(){try{localStorage.removeItem("decadeSliceV2")}catch(e){}location.reload()}
const cs=i=>15*8**i*Math.pow(3,S.w), rt=i=>6**i;
const castoff=(n,i)=>(S.w==0&&i>=3&&n>=40)?(S.tree.includes('co2')?3:S.tree.includes('co1')?2:1):1;
const mult=(n,i)=>2**MS.filter(m=>n>=m).length*castoff(n,i), cost=i=>cs(i)*G**S.own[i];
const sealMult=()=>1+BONUS*S.seals, carry=()=>3**S.w*(1+.1*S.cards)*(1+.02*Math.sqrt(S.arch||0));
const rate=i=>S.own[i]*rt(i)*mult(S.own[i],i);
const treeMult=()=>(S.tree.includes('sp1')?1.3:1)*(S.tree.includes('sp2')?1.3:1);
const prod=()=>S.own.reduce((s,_,i)=>s+rate(i),0)*sealMult()*carry()*treeMult()*(S.clock>0?(S.tree.includes('sp2')?3:2):1);
const avail=i=>i==0||S.own[i-1]>=5;
const pend=()=>Math.floor(Math.sqrt(S.life/(TH*(S.tree.includes('rc1')?.5:1)*Math.pow(3,S.w))));
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];const fmt=x=>{if(x<1e3)return x.toFixed(x<100?1:0);let e=Math.min(SUF.length-1,Math.floor(Math.log10(x)/3));if(e>=SUF.length-1&&x>=1e36)return x.toExponential(2);return (x/Math.pow(10,3*e)).toFixed(2)+SUF[e]};
const $=id=>document.getElementById(id);
function goal(why){const now=S.run;const gap=now-S.lastGoal;S.lastGoal=now;S.goals.push(gap);if(S.goals.length>40)S.goals.shift();}
function buy(i){const c=cost(i);if(S.gold<c)return;S.gold-=c;S.own[i]++;S.maxTier=Math.max(S.maxTier,i);
 if(S.own[i]==1||MS.includes(S.own[i])||(S.w==0&&S.own[i]==40))goal();render()}
$("clock").onclick=()=>{if(S.w!=0||S.charge<4||S.clock>0)return;S.charge-=4;S.clock=8};
$("photo").onclick=()=>{if(S.photoCD>0)return;const v=prod()*6;S.gold+=v;S.life+=v;S.wlife+=v;S.photoCD=60;};  // active layer ≈ 6 s of income per 60 s (+10 %)
$("ffr").onclick=()=>{const p=pend();if(p<1||S.maxTier<3)return;S.seals+=p;S.mp++;S.gold=cs(0);S.life=0;S.own=[0,0,0,0,0,0];S.maxTier=0;S.run=0;S.lastGoal=0;toast(`Final Form Ride! +${p} Seals (×${sealMult().toFixed(2)})`)};
$("dim").onclick=()=>{if(S.w>=WORLDS.length-1)return;S.arch=(S.arch||0)+S.seals;S.seals=0;S.w++;S.cards++;S.gold=cs(0);S.life=0;S.wlife=0;S.own=[0,0,0,0,0,0];S.maxTier=0;S.run=0;S.lastGoal=0;document.body.style.transition="filter .5s";document.body.style.filter="brightness(1.5)";setTimeout(()=>document.body.style.filter="",500);toast(`KAMEN RIDE — ${WORLDS[S.w].n}! Seals archived (+bonus), Cards kept (+10% each). New rule here.`)};
const TREE=[["sp1","Speed I: ×1.3 production",1,null],["sp2","Speed II: Clock Up ×5, ×1.3 more",2,"sp1"],["co1","Cast Off I: ×2 at 40 owned",1,null],["co2","Cast Off II: ×3 at 40 owned",2,"co1"],["rc1","Recipes I: offline 50%→65%, rides need 50% less",1,null],["rc2","Recipes II: +1 Charge cap, Charge regen ×2",2,"rc1"]];
function buyNode(id){const n=TREE.find(t=>t[0]==id);if(S.tree.includes(id)||S.mp<n[2]||(n[3]&&!S.tree.includes(n[3])))return;S.mp-=n[2];S.tree.push(id);render()}
function toast(m){const t=$("toast");t.style.display="block";t.textContent=m;setTimeout(()=>t.style.display="none",5000)}
function offline(sec){const s=Math.min(sec!==undefined?sec:(Date.now()-S.last)/1000,8*3600);if(s<120)return;const e1=S.tree.includes('rc1')?.65:.5;const a=Math.min(s,7200)*e1+Math.max(0,s-7200)*.25;const e=prod()*a;S.gold+=e;S.life+=e;S.wlife+=e;toast(`Welcome back! Away ${(s/60).toFixed(0)} min → +${fmt(e)} Shots (${(100*a/s).toFixed(0)}% efficiency)`)}
let _lastSig='';function render(){
 const sg=sig(),structural=sg!==_lastSig;_lastSig=sg;
 $("clockcard").style.display=S.w==0?"block":"none";$("clock").disabled=S.charge<4||S.clock>0;$("cinfo").textContent=S.clock>0?`active ${S.clock.toFixed(0)}s`:`Charge ${S.charge.toFixed(1)}/${S.tree.includes('rc2')?15:10}`;
 $("mp").textContent=S.mp;if(structural)$("tree").innerHTML=TREE.map(t=>`<button style="margin:3px" ${S.tree.includes(t[0])||S.mp<t[2]||(t[3]&&!S.tree.includes(t[3]))?"disabled":""} onclick="buyNode('${t[0]}')">${S.tree.includes(t[0])?"✔ ":""}${t[1]} (${t[2]})</button>`).join("");
 const p=pend(),ns=S.seals+p,ratio=(1+BONUS*ns)/(1+BONUS*S.seals);$("prevtxt").textContent=p>=1?`Ride preview: +${p} Seals → ×${ratio.toFixed(2)} production on restart, +1 mastery point. Run restarts from 0 generators.`:"Ride preview: not enough progress yet.";
 $("title").textContent=`World ${S.w+1}: ${WORLDS[S.w].n}`;$("gold").textContent=fmt(S.gold);$("ps").textContent=fmt(prod());
 $("seals").textContent=S.seals;$("sm").textContent=sealMult().toFixed(2);$("cards").textContent=S.cards;
 const gl=GOALMULT[S.w]||1e12;$("goalv").textContent=`${fmt(S.wlife)} / ${fmt(gl)} world-lifetime Shots (DEV gate)`;$("goalbar").style.width=Math.min(100,100*S.wlife/gl)+"%";
 $("dim").disabled=S.wlife<gl||S.w>=WORLDS.length-1;$("dinfo").textContent=S.w>=WORLDS.length-1?"(final world of the slice)":"(needs goal; keeps Seals+Cards)";
 $("ffr").disabled=pend()<1||S.maxTier<3;$("ffrinfo").textContent=`pending ${pend()} Seals${pend()>=Math.max(1,2*S.seals)?" ✔ worth it (≥2×)":""}${S.maxTier<3?" · need 4 tiers seen":""}`;
 $("photo").disabled=S.photoCD>0;$("photo").textContent=S.photoCD>0?`Photo Op (${Math.ceil(S.photoCD)}s)`:"Photo Op!";
 let h="";for(let i=0;i<6;i++){if(!avail(i))continue;const n=S.own[i],nx=MS.find(m=>m>n),pv=[0,...MS].filter(m=>m<=n).pop();
  h+=`<div class=card><div class=row><div><b>${WORLDS[S.w].t[i]}</b> ×${n} <small>(×${mult(n)}; ${fmt(rt(i)*mult(n))}/s each)</small><br><small>${nx?`×2 in ${nx-n}`:"maxed"}</small></div><button ${S.gold<cost(i)?"disabled":""} onclick="buy(${i})">${fmt(cost(i))}</button></div><div class=bar><i style="width:${nx?100*(n-pv)/(nx-pv):100}%"></i></div></div>`}
 if(structural)$("gens").innerHTML=h;
 $("tel").innerHTML=S.goals.map(g=>`<span title="${g.toFixed(0)}s" style="height:${Math.min(40,3+Math.log10(1+g)*9)}px;background:${g>600?"#f0b64a":g<15?"#8a93a6":"#5fd18a"}"></span>`).join("");
 const gs=S.goals.slice().sort((a,b)=>a-b);$("stats").textContent=gs.length?`median gap ${gs[gs.length>>1].toFixed(0)}s · max ${gs[gs.length-1].toFixed(0)}s · in-band(15–600s) ${(100*gs.filter(g=>g>=15&&g<=600).length/gs.length).toFixed(0)}%`:"";
}
offline();render();
let last=performance.now(),lastSig="";
function sig(){return JSON.stringify([S.w,S.own,S.own.map((_,i)=>S.gold>=cost(i)),S.tree,S.mp>0,S.seals,S.clock>0,S.charge>=4])}
function auto(){ // payback-greedy auto-buy after first ride (R21)
 for(let k=0;k<3;k++){const P=prod();let b=-1,bs=1e300;for(let i=0;i<6;i++){if(!avail(i))continue;const c=cost(i);if(S.gold<c)continue;const n=S.own[i];const gain=((n+1)*rt(i)*mult(n+1,i)-n*rt(i)*mult(n,i))*sealMult()*carry()*treeMult();const sc=c/Math.max(gain,1e-9);if(sc<bs){bs=sc;b=i}}if(b>=0)buy(b);else break}}
setInterval(()=>{const now=performance.now(),real=(now-last)/1000;last=now;
 if(real>2){offline(real);return}                         // throttled/hidden tab: route through the offline model (no 100 % credit)
 const dt=real*spd,e=prod()*dt;S.gold+=e;S.life+=e;S.wlife+=e;S.run+=dt;S.photoCD=Math.max(0,S.photoCD-dt);S.clock=Math.max(0,S.clock-dt);S.charge=Math.min(S.tree.includes('rc2')?15:10,S.charge+dt/(S.tree.includes('rc2')?4:8));
 if(S.seals>0)auto();
 render();},100);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState=="visible"){last=performance.now()}});
setInterval(save,5000);addEventListener("beforeunload",save);
</script>
