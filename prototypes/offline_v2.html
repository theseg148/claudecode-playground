<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Welcome-back card v2</title>
<style>:root{--bg:#12151c;--card:#1c2230;--ink:#e8ecf4;--dim:#8a93a6;--acc:#e0457b}body{margin:0;font:15px system-ui;background:var(--bg);color:var(--ink)}main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}button{font:inherit;color:var(--ink);background:#2b3550;border:0;border-radius:8px;padding:8px 12px;margin:2px;cursor:pointer}small{color:var(--dim)}table{width:100%;border-collapse:collapse}td{padding:2px 4px}td:last-child{text-align:right}input[type=range]{width:100%}</style>
<main><h3>Welcome-back card (R35/R36)</h3>
<div class=card>Away: <b id=lab></b><input id=sl type=range min=0 max=1440 value=480 step=1><small>Rules: absences &lt;2 min ignored; measured from saved quit time; 50 % for first 2 h, 25 % beyond, 8 h cap; 1 Exposure per 30 min offline (cap 6) delivered at half value; banked Time Skip (×5 speed) = 20 % of capped time; auto-spend shows what was bought.</small></div>
<div id=out class=card></div>
<script>
// Toy economy: production P shots/s; greedy "auto-spend" buys tiers of cost 100*1.12^n (P += 0.5 per unit).
const P=100;
function calc(min){
 const sec=min*60,capped=Math.min(sec,8*3600);
 if(sec<120)return{ignored:true};
 const eff=Math.min(capped,7200)*.5+Math.max(0,capped-7200)*.25,earn=P*eff;
 const exp=Math.min(6,Math.floor(capped/1800)),expVal=exp*P*119*.5; // 119 production-seconds per window at half value
 const skip=capped*.2;                  // banked seconds of x5 speed
 // auto-spend: buy with earn
 let gold=earn,n=0,cost=100;while(gold>=cost&&n<500){gold-=cost;n++;cost*=1.12}
 return{sec,capped,eff,earn,exp,expVal,skip,n,left:gold,pct:100*eff/capped}
}
function fmt(x){return x<1e4?x.toFixed(0):x.toExponential(2)}
function r(){const m=+sl.value;lab.textContent=(m/60).toFixed(1)+" h ("+m+" min)";const c=calc(m);
 out.innerHTML=c.ignored?"<b>No card</b> <small>(absence under 2 minutes is ignored)</small>":
 `<b>Welcome back!</b><table><tr><td>Time counted</td><td>${(c.capped/3600).toFixed(1)} h${c.sec>c.capped?" (capped at 8 h)":""}</td></tr>
 <tr><td>Efficiency</td><td>${c.pct.toFixed(0)} %</td></tr><tr><td>Shots earned</td><td>+${fmt(c.earn)}</td></tr>
 <tr><td>Exposures banked</td><td>${c.exp}/6 (≈ +${fmt(c.expVal)} Shots)</td></tr>
 <tr><td>Time Skip charge (×5 speed)</td><td>${(c.skip/60).toFixed(0)} min</td></tr></table>
 <hr><small>Auto-spend suggestion: buy ${c.n} units of the cheapest tier (${fmt(c.left)} left).</small><br>
 <button>Collect &amp; spend</button><button>Collect only</button><br><small>Decisions on return: ① spend vs save for ride, ② use Exposures now or keep. Never a forced ad; optional rewarded claim would be a separate button.</small>`}
sl.oninput=r;r();
</script></main>
