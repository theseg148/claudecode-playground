<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>World transition (v2)</title>
<style>body{font:15px system-ui;background:#12151c;color:#e8ecf4;max-width:560px;margin:0 auto;padding:12px 16px;transition:filter .5s}button{font:inherit;padding:10px 14px;background:#2b3550;color:#e8ecf4;border:0;border-radius:8px;cursor:pointer}button:disabled{opacity:.4}.card{background:#1c2230;padding:10px 12px;border-radius:10px;margin:8px 0}small{color:#8a93a6}progress{width:100%}.ok{color:#5fd18a}</style>
<h3 id=wn>World 1: Kabuto</h3>
<div class=card><b>Gate — 3 named costs</b> <small>(R28: always visible, completing pays a Ride Card)</small>
<div>① Shots <progress id=p1 max=100 value=0></progress> <small id=t1></small></div>
<div>② Zecter types collected <progress id=p2 max=3 value=0></progress> <small id=t2></small></div>
<div>③ Hyper Clock Up used once <span id=t3>☐</span></div></div>
<div class=card>Shots <b id=e></b> (+<b id=r></b>/s) · carry ×<b id=c>1</b> · <button onclick="act2()">Collect Zecter</button> <button onclick="act3()">Use Hyper Clock Up</button> <button onclick="boost=boost==1?200:1">Speed ×<span id=sp>1</span></button></div>
<div class=card id=recap style=display:none></div>
<button id=go disabled onclick=ride()>Dimension Ride →</button>
<script>
const W=[{n:"Kabuto",goal:2e5,carry:1},{n:"Den-O",goal:6e5,carry:3}];let w=0,e=1,own=1,carry=1,z=0,hc=false,boost=1,tw=0,cards=0;
function act2(){if(z<3)z++} function act3(){hc=true}
function ride(){const t=tw;document.body.style.filter="brightness(1.6)";setTimeout(()=>document.body.style.filter="",500);cards++;
 recap.style.display="block";recap.innerHTML=`<b>Recap: Kabuto cleared</b> in ${(t/60).toFixed(1)} sim-min.<br>Kept: Ride Cards (${cards}), automation, Seals archived (+bonus).<br>Reset: Shots and generators.<br><small>New rule here: Contracts. First purchase affordable within 60 s (R10). Bar starts pre-filled by the carried-over card (endowed progress, R30).</small>`;
 w=1;carry=3;own=1;z=0;hc=false;tw=0;e=W[1].goal*0.05;wn.textContent="World 2: Den-O";go.disabled=true;go.textContent="Final world (prototype)"}
setInterval(()=>{own+=0.02*boost;const rt=own*carry,d=rt/10*boost;e+=d;tw+=.1*boost;
 const g=W[w].goal;p1.max=g;p1.value=Math.min(g,e);t1.textContent=`${Math.floor(e)}/${g}`;p2.value=z;t2.textContent=`${z}/3`;t3.textContent=hc?"☑":"☐";
 document.getElementById("e").textContent=Math.floor(e);r.textContent=rt.toFixed(1);c.textContent=carry;sp.textContent=boost;
 go.disabled=!(w==0&&e>=g&&z>=3&&hc)},100);
</script>
