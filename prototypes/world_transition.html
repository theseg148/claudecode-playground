<!doctype html><meta charset=utf-8><title>World transition</title>
<style>body{font:15px system-ui;background:#111;color:#eee;max-width:560px;margin:20px auto;padding:0 16px;transition:background 1s}button{padding:12px 16px;background:#2a3a55;color:#fff;border:0;border-radius:6px}.card{background:#1d2433;padding:12px;border-radius:8px;margin:10px 0}#fx{height:60px;line-height:60px;text-align:center;font-size:22px;letter-spacing:4px}</style>
<h3 id=wn>World 1: Kabuto</h3><div class=card>Progress to Decade Link: <progress id=pg max=100 value=0 style=width:100%></progress> <span id=pc></span></div>
<div class=card>Energy <b id=e></b> (+<b id=r></b>/s) · Carryover mult x<b id=c>1</b></div>
<div id=fx></div><button id=go disabled onclick=ride()>Dimension Ride →</button>
<script>
const W=[["Kabuto","#2b1a1a",1],["Next world (Den-O?)","#1a2540",3]];let w=0,e=0,own=1,carry=1,goal=2e4;
function ride(){fx.textContent="━━ ATTACK RIDE ━━ KAMEN RIDE ━━";document.body.style.background="#fff";setTimeout(()=>{w=1;e=0;own=1;carry*=3;goal=6e4;document.body.style.background=W[1][1];wn.textContent="World 2: "+W[1][0];fx.textContent="Kept: Mastery ×2, Seals, Auto-buy. Reset: generators.";go.disabled=true;go.textContent="Final world (prototype)"},1200)}
setInterval(()=>{own+=.02;const rt=own*carry;e+=rt/10;pg.value=Math.min(100,100*e/goal);pc.textContent=pg.value.toFixed(0)+"%";document.getElementById("e").textContent=e.toFixed(0);r.textContent=rt.toFixed(1);c.textContent=carry;if(e>=goal&&w==0)go.disabled=false},100);
</script>
